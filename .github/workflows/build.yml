name: Build server

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Build every pushed commit; only superseded PR checks are cancelled.
  group: build-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust and build tools
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt
          rustup override set 1.96.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build standalone server
        run: npm run build:release -- --native
      - name: Check formatting and Rust tests
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo build --locked -p kantengyen-server
      - name: Check embedded assets
        run: npm run test:build
      - name: Test release server
        shell: bash
        run: |
          set -euo pipefail
          BIND_ADDR=127.0.0.1:3000 ./dist/kantengyen-server > /tmp/kantengyen-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/kantengyen-server.log' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          npm run test:e2e
          npm run test:voice
      - name: Package server with licenses
        run: |
          tar -C dist -czf kantengyen-server-linux-x64.tar.gz kantengyen-server SHA256SUMS LICENSE THIRD_PARTY_NOTICES.md licenses
          sha256sum kantengyen-server-linux-x64.tar.gz > kantengyen-server-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kantengyen-server-linux-x64
          path: |
            kantengyen-server-linux-x64.tar.gz
            kantengyen-server-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  nightly:
    needs: linux-x64
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kantengyen-server-linux-x64
          path: release
      - name: Update rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c kantengyen-server-linux-x64.tar.gz.sha256
          # A slower old build must not overwrite the latest branch's nightly.
          head_sha=$(gh api "repos/${GH_REPO}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)
          if [ "$head_sha" != "$BUILD_SHA" ]; then
            echo 'Newer commits exist; keeping this build as an Actions artifact.'
            exit 0
          fi
          title="Nightly (${BUILD_SHA:0:7})"
          cat > notes.md <<EOF
          默认分支每次推送构建并验证后，更新此每夜版与同名附件。

          - 源码提交：${BUILD_SHA}
          - 构建记录：${RUN_URL}
          - 平台：Linux x64，前端与 WASM 已内嵌。
          - 校验：下载两个附件，执行 sha256sum -c kantengyen-server-linux-x64.tar.gz.sha256。
          - 升级会清空内存房间和对局，请在无对局时维护。

          部署说明：https://github.com/${GH_REPO}/blob/${BUILD_SHA}/deploy/README.md
          EOF
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly kantengyen-server-linux-x64.tar.gz kantengyen-server-linux-x64.tar.gz.sha256 --clobber
            # Keep the rolling tag aligned with the binary's actual source commit.
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/nightly" -f sha="$BUILD_SHA" -F force=true
          else
            gh release create nightly kantengyen-server-linux-x64.tar.gz kantengyen-server-linux-x64.tar.gz.sha256 \
              --target "$BUILD_SHA" --title "$title" --notes-file notes.md --prerelease --draft --latest=false
          fi
          gh release edit nightly --title "$title" --notes-file notes.md --prerelease --draft=false --latest=false
