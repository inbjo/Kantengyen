name: Build server

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust and build tools
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt
          rustup override set 1.96.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build standalone server
        run: npm run build:release -- --native
      - name: Check formatting and Rust tests
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo build --locked -p kantengyen-server
      - name: Check embedded assets
        run: npm run test:build
      - name: Test release server
        shell: bash
        run: |
          set -euo pipefail
          BIND_ADDR=127.0.0.1:3000 ./dist/kantengyen-server > /tmp/kantengyen-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/kantengyen-server.log' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          npm run test:e2e
          npm run test:voice
      - name: Package server with licenses
        run: |
          tar -C dist -czf kantengyen-server-linux-x64.tar.gz kantengyen-server SHA256SUMS LICENSE THIRD_PARTY_NOTICES.md licenses
          sha256sum kantengyen-server-linux-x64.tar.gz > kantengyen-server-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kantengyen-server-linux-x64
          path: |
            kantengyen-server-linux-x64.tar.gz
            kantengyen-server-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
