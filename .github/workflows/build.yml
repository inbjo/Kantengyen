name: Build server

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Build every pushed commit; only superseded PR checks are cancelled.
  group: build-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust and build tools
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt
          rustup override set 1.96.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build standalone server
        run: npm run build:release -- --native
      - name: Check formatting and Rust tests
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo build --locked -p kantengyen-server
      - name: Check embedded assets
        run: npm run test:build
      - name: Test release server
        shell: bash
        run: |
          set -euo pipefail
          BIND_ADDR=127.0.0.1:3000 ./dist/kantengyen-server > /tmp/kantengyen-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/kantengyen-server.log' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          run_test() {
            local task="$1"
            local logfile="/tmp/kantengyen-${task//:/-}.log"
            if npm run "$task" > "$logfile" 2>&1; then
              cat "$logfile"
            else
              cat "$logfile"
              # Expose test failures through check annotations as well as logs.
              local details
              details=$(tail -c 3500 "$logfile")
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=${task} failed::${details}"
              return 1
            fi
          }
          run_test test:e2e
          run_test test:voice
      - name: Package server with licenses
        run: |
          tar -C dist -czf kantengyen-server-linux-x64.tar.gz kantengyen-server SHA256SUMS LICENSE THIRD_PARTY_NOTICES.md licenses
          sha256sum kantengyen-server-linux-x64.tar.gz > kantengyen-server-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kantengyen-server-linux-x64
          path: |
            kantengyen-server-linux-x64.tar.gz
            kantengyen-server-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  docker-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install browser tests
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build Compose deployment and test embedded TURN
        shell: bash
        run: |
          set -euo pipefail
          # A documentation-only address exercises relay routing without public NAT.
          export TURN_PUBLIC_IP=203.0.113.10
          export TURN_PUBLIC_HOST=$(hostname -I | awk '{print $1}')
          export TURN_ENABLED=true VOICE_ICE_POLICY=relay
          export SITE_ADDRESS=http://localhost TEST_BASE_URL=http://localhost
          export EXPECT_TURN_RELAY=1 TURN_TRANSPORT=udp
          compose() { docker compose -f compose.yaml -f compose.tls.yaml "$@"; }
          mkdir -p deploy/turn-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=turn-test \
            -addext "subjectAltName=IP:${TURN_PUBLIC_HOST},DNS:localhost" -addext "basicConstraints=critical,CA:FALSE" \
            -addext extendedKeyUsage=serverAuth -keyout deploy/turn-certs/privkey.pem \
            -out deploy/turn-certs/fullchain.pem > /tmp/turn-cert.log 2>&1
          export TEST_TLS_SPKI=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {X509Certificate,createHash} from "node:crypto"; console.log(createHash("sha256").update(new X509Certificate(readFileSync("deploy/turn-certs/fullchain.pem")).publicKey.export({type:"spki",format:"der"})).digest("base64"));')
          sudo chown 10001:10001 deploy/turn-certs/privkey.pem
          sudo chmod 640 deploy/turn-certs/privkey.pem
          cleanup() {
            status=$?
            compose logs --no-color > /tmp/compose.log 2>&1 || true
            cat /tmp/compose.log
            if [ "$status" -ne 0 ]; then
              for logfile in /tmp/turn-build.log /tmp/turn-test.log /tmp/compose.log; do
                if [ -s "$logfile" ]; then
                  # GitHub truncates each annotation to 4096 characters.
                  details=$(tail -c 3500 "$logfile")
                  details="${details//'%'/'%25'}"
                  details="${details//$'\r'/'%0D'}"
                  details="${details//$'\n'/'%0A'}"
                  echo "::error title=Docker TURN verification (${logfile##*/})::${details}"
                fi
              done
            fi
            compose down --volumes || true
            exit "$status"
          }
          trap cleanup EXIT
          compose config --quiet
          compose up --detach --build 2>&1 | tee /tmp/turn-build.log
          # Exercise the certificate exporter without requesting public certificates.
          compose exec -T caddy mkdir -p /data/caddy/certificates/test/localhost
          compose cp deploy/turn-certs/fullchain.pem caddy:/data/caddy/certificates/test/localhost/localhost.crt
          sudo docker cp deploy/turn-certs/privkey.pem "$(compose ps -q caddy)":/data/caddy/certificates/test/localhost/localhost.key
          sudo "$(command -v node)" scripts/export-turn-cert.mjs --domain localhost 2>&1 | tee -a /tmp/turn-build.log
          wait_ready() {
            for attempt in {1..60}; do
              if curl --fail --silent "$TEST_BASE_URL/api/health"; then return; fi
              sleep 1
            done
            return 1
          }
          wait_ready
          # Signalling passes through Caddy; test each relay transport independently.
          npm run test:e2e > /tmp/turn-test.log 2>&1
          npm run test:voice >> /tmp/turn-test.log 2>&1
          for transport in udp tcp tls; do
            export TURN_TRANSPORT="$transport" EXPECT_TURN_TRANSPORT="$transport"
            compose up --detach --no-build game
            wait_ready
            npx playwright test tests/ui/voice.spec.ts 2>&1 | tee -a /tmp/turn-test.log
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-turn-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  nightly:
    needs: [linux-x64, docker-deployment]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kantengyen-server-linux-x64
          path: release
      - name: Update rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c kantengyen-server-linux-x64.tar.gz.sha256
          # A slower old build must not overwrite the latest branch's nightly.
          head_sha=$(gh api "repos/${GH_REPO}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)
          if [ "$head_sha" != "$BUILD_SHA" ]; then
            echo 'Newer commits exist; keeping this build as an Actions artifact.'
            exit 0
          fi
          title="Nightly (${BUILD_SHA:0:7})"
          cat > notes.md <<EOF
          默认分支每次推送构建并验证后，更新此每夜版与同名附件。

          - 源码提交：${BUILD_SHA}
          - 构建记录：${RUN_URL}
          - 平台：Linux x64，前端与 WASM 已内嵌。
          - 校验：下载两个附件，执行 sha256sum -c kantengyen-server-linux-x64.tar.gz.sha256。
          - 升级会清空内存房间和对局，请在无对局时维护。

          部署说明：https://github.com/${GH_REPO}/blob/${BUILD_SHA}/deploy/README.md
          EOF
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly kantengyen-server-linux-x64.tar.gz kantengyen-server-linux-x64.tar.gz.sha256 --clobber
            # Keep the rolling tag aligned with the binary's actual source commit.
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/nightly" -f sha="$BUILD_SHA" -F force=true
          else
            gh release create nightly kantengyen-server-linux-x64.tar.gz kantengyen-server-linux-x64.tar.gz.sha256 \
              --target "$BUILD_SHA" --title "$title" --notes-file notes.md --prerelease --draft --latest=false
          fi
          gh release edit nightly --title "$title" --notes-file notes.md --prerelease --draft=false --latest=false
