# Standalone coturn for a Linux server; run alongside the game or on another host.
services:
  coturn:
    image: coturn/coturn:4.18.0-r0
    network_mode: host
    user: '${COTURN_UID:-65534}:${COTURN_GID:-65534}'
    restart: unless-stopped
    command: ['-c', '/etc/coturn/turnserver.conf', '--log-file=stdout']
    volumes:
      - type: bind
        source: ./deploy/turnserver.conf
        target: /etc/coturn/turnserver.conf
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/lib/coturn:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
