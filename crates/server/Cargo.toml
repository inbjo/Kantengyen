[package]
name = "kantengyen-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
kantengyen-core = { path = "../game-core" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
turn = "0.17.2"
webrtc-util = { version = "0.17.2", default-features = false, features = ["conn"] }
async-trait = "0.1"
