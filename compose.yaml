services:
  game:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:3000
      STATE_PATH: /data/state.json
      RUST_LOG: kantengyen_server=info
      VOICE_ICE_SERVERS: "${VOICE_ICE_SERVERS:-[]}"
      VOICE_ICE_POLICY: "${VOICE_ICE_POLICY:-all}"
      VOICE_TURN_URLS: "${VOICE_TURN_URLS:-}"
      VOICE_TURN_SECRET: "${VOICE_TURN_SECRET:-}"
      TURN_ENABLED: "${TURN_ENABLED:-true}"
      TURN_PUBLIC_IP: "${TURN_PUBLIC_IP:-}"
      TURN_PUBLIC_HOST: "${TURN_PUBLIC_HOST:-}"
      TURN_BIND_ADDR: 0.0.0.0:3478
      TURN_TCP_ENABLED: "${TURN_TCP_ENABLED:-true}"
      TURN_TCP_PUBLIC_PORT: "${TURN_TCP_PUBLIC_PORT:-3478}"
      TURN_TCP_BIND_ADDR: 0.0.0.0:3478
      TURN_TRANSPORT: "${TURN_TRANSPORT:-all}"
      TURN_MAX_CONNECTIONS: "${TURN_MAX_CONNECTIONS:-128}"
      TURN_RELAY_IP: 0.0.0.0
      TURN_MIN_PORT: '49160'
      TURN_MAX_PORT: '49223'
      TURN_MAX_ALLOCATIONS: "${TURN_MAX_ALLOCATIONS:-64}"
      TURN_BYTES_PER_SECOND: "${TURN_BYTES_PER_SECOND:-128000}"
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49223:49160-49223/udp'
    expose:
      - "3000"
    volumes:
      - game_data:/data
    stop_grace_period: 10s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game
volumes:
  game_data:
  caddy_data:
  caddy_config:
